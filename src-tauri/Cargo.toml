[package]
name = "personal-workspace"
version = "0.1.0"
description = "Local-first personal workspace for macOS"
edition = "2021"
default-run = "personal-workspace"

[lib]
name = "personal_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "personal-workspace"
path = "src/main.rs"

[[bin]]
name = "workspace_mcp"
path = "src/bin/workspace_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
